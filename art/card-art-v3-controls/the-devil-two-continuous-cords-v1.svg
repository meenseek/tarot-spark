<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="1484" viewBox="0 0 1060 1484">
  <rect width="1060" height="1484" fill="#f4ead2"/>

  <!-- Inanimate statue: context only. The control authority is the two cord paths. -->
  <g fill="#827667">
    <path d="M425 305 L465 225 L500 315 Z"/>
    <path d="M560 315 L595 225 L635 305 Z"/>
    <circle cx="530" cy="360" r="120"/>
    <path d="M405 470 Q530 405 655 470 L700 925 L360 925 Z"/>
  </g>
  <rect x="390" y="900" width="280" height="145" rx="20" fill="#6d6358"/>

  <!-- Exactly two adult silhouettes, separated so both cord routes remain visible. -->
  <g fill="#334554">
    <circle cx="270" cy="635" r="78"/>
    <path d="M205 715 Q270 675 335 715 L380 1115 Q270 1185 160 1115 Z"/>
    <path d="M215 760 Q145 735 115 650 L155 630 Q205 695 260 705 Z"/>
    <path d="M325 760 Q390 790 420 885 L380 900 Q345 815 285 790 Z"/>

    <circle cx="790" cy="635" r="78"/>
    <path d="M725 715 Q790 675 855 715 L900 1115 Q790 1185 680 1115 Z"/>
    <path d="M845 760 Q915 735 945 650 L905 630 Q855 695 800 705 Z"/>
    <path d="M735 760 Q670 790 640 885 L680 900 Q715 815 775 790 Z"/>
  </g>

  <!-- Cord 1: one unbroken route from the left statue-base guide, loosely around the left torso, to its raised hand. -->
  <path
    d="M430 965
       C360 1080 290 1150 190 1145
       C75 1140 55 1020 80 880
       C95 785 115 700 142 650"
    fill="none"
    stroke="#d39a2e"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="34"
  />

  <!-- Cord 2: one separate mirrored route from the right guide to the right raised hand. -->
  <path
    d="M630 965
       C700 1080 770 1150 870 1145
       C985 1140 1005 1020 980 880
       C965 785 945 700 918 650"
    fill="none"
    stroke="#d39a2e"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="34"
  />

</svg>

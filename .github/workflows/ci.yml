name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format
            command: pnpm run format:check
          - name: Lint
            command: pnpm run lint
          - name: Docs Lint
            command: pnpm run docs:lint
          - name: Typecheck
            command: pnpm run typecheck
          - name: Test
            command: pnpm run test
          - name: E2E
            command: pnpm run test:e2e
            playwright: true
          - name: Build
            command: pnpm run build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: ${{ matrix.playwright == true }}
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Prepare temporary image request diagnostics
        if: ${{ matrix.playwright == true }}
        run: |
          cat > "${RUNNER_TEMP}/tarot-image-diagnostic.cjs" <<'NODE'
          const http = require("node:http");
          const originalEmit = http.Server.prototype.emit;
          let count = 0;
          function log(value) {
            try {
              console.error("IMAGE_REQUEST_DIAGNOSTIC", JSON.stringify(value));
            } catch {}
          }
          http.Server.prototype.emit = function (event, ...args) {
            try {
              if (event === "request") {
                const [request, response] = args;
                const url = new URL(request.url, "http://127.0.0.1");
                const image = url.searchParams.get("url") ?? url.pathname;
                if (
                  (url.pathname === "/_next/image" || url.pathname.startsWith("/cards/")) &&
                  /^\/cards\/[a-z0-9-]+\.jpg$/.test(image)
                ) {
                  count += 1;
                  if (count <= 1024) {
                    const started = performance.now();
                    const identity = {
                      pid: process.pid,
                      id: count,
                      path: url.pathname,
                      image,
                      width: Number(url.searchParams.get("w")) || null,
                    };
                    log({ ...identity, phase: "request", at: started });
                    for (const phase of ["finish", "close"]) {
                      response.once(phase, () => {
                        try {
                          log({
                            ...identity,
                            phase,
                            elapsed: performance.now() - started,
                            status: response.statusCode,
                            finished: response.writableFinished,
                          });
                        } catch {}
                      });
                    }
                  } else if (count === 1025) {
                    log({ pid: process.pid, phase: "limit", limit: 1024 });
                  }
                }
              }
            } catch {}
            return originalEmit.call(this, event, ...args);
          };
          NODE

      - name: Run ${{ matrix.name }}
        env:
          DEBUG: ${{ matrix.playwright && 'pw:webserver' || '' }}
        run: |
          if [ "${{ matrix.playwright }}" = "true" ]; then
            export NODE_OPTIONS="${NODE_OPTIONS:+${NODE_OPTIONS} }--require=${RUNNER_TEMP}/tarot-image-diagnostic.cjs"
          fi
          ${{ matrix.command }}

      - name: Upload E2E failure evidence
        if: ${{ failure() && matrix.playwright == true }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
